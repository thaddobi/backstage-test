# app-config.yaml
proxy:
  '/jira/api':
    target: https://reqcentral.com/projects/MPLATFORM/issues/
    #<JIRA_URL>
    headers:
      Authorization: 'OTMwMjU1NDA1NDY0OsnSSAiAvOWAWIt+L5yUHeZvEz3h' # ${JIRA_TOKEN}
      Accept: 'application/json'
      Content-Type: 'application/json'
      X-Atlassian-Token: 'no-check'
      # This is a workaround since Jira APIs reject browser origin requests. Any dummy string without whitespace works.
      User-Agent: 'AnyRandomString'

jira:
  # Defaults to /jira/api and can be omitted if proxy is configured for that url
  proxyPath: /jira/api
  # Add it in case your JIRA instance is connected to Confluence, in order to filter those activities
  confluenceActivityFilter: wiki@uuid
  # Defaults to latest and can be omitted if you want to use the latest version of the api
  apiVersion: latest

# app-config.yaml
backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  # ...
  csp:
    img-src:
      # "'self'" and 'data' are from the backstage default but must be set since img-src is overriden
      - "'self'"
      - 'data:'
      # Allow your Jira instance for @roadiehq/backstage-plugin-jira
      - 'JIRA_URL'
  database:
    # client: better-sqlite3
    # connection: ':memory:'
    # config options: https://node-postgres.com/apis/client
    client: pg
    connection:
      host: localhost
      port: 5433
      user: postgres
      password: postgres

jiraDashboard:
  token: 'OTMwMjU1NDA1NDY0OsnSSAiAvOWAWIt+L5yUHeZvEz3h' #${JIRA_TOKEN}
  baseUrl: https://reqcentral.com/projects/MPLATFORM/issues/
  #${JIRA_BASE_URL}
  headers: {} # Optional
  userEmailSuffix: '@rci.rogers.com' #${JIRA_EMAIL_SUFFIX} # Optional-e.g @rci.rogers.com
  annotationPrefix: jira #${JIRA_ANNOTATION_PREFIX} # Optional

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  # ...
  annotations:
    # jira.com/project-key: value # Single Jira project key
    # Or if your component is part of multiple Jira projects, you can specify multiple project keys by providing a comma-separated list
    jira.com/project-key: MPLATFORM #,bcd,def # Comma-separated list of Jira project keys

soundcheck:
  collectors:
    jira:
      baseUrl: https://jira-instance.atlassian.net
      username: thaddeus.obi@rci.rogers.com # This could be your email or username that you use to log in to jira
      apiToken: OTMwMjU1NDA1NDY0OsnSSAiAvOWAWIt+L5yUHeZvEz3h # Generate new token https://id.atlassian.com/manage-profile/security/api-tokens
